name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: toolchain/MyAssembler

    steps:
      - name: Checkout MyAssembler
        uses: actions/checkout@v4
        with:
          path: toolchain/MyAssembler

      - name: Checkout MyLinker
        uses: actions/checkout@v4
        with:
          repository: Keyhole-Koro/MyLinker
          path: toolchain/MyLinker

      - name: Checkout MyEmulator
        uses: actions/checkout@v4
        with:
          repository: Keyhole-Koro/MyEmulator
          path: runtime/MyEmulator

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++

      - name: Run assembler-owned tests
        run: make test-all

      - name: Run toolchain E2E tests
        run: make test-e2e
