name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: toolchain/MyAssembler

    steps:
      - name: Checkout MyAssembler
        uses: actions/checkout@v4
        with:
          path: toolchain/MyAssembler

      # MyAssembler currently consumes the shared object-format headers directly.
      - name: Checkout MyLinker headers
        uses: actions/checkout@v4
        with:
          repository: Keyhole-Koro/MyLinker
          path: toolchain/MyLinker

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Run assembler component tests
        run: make test-component
